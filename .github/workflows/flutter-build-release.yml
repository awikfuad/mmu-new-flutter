name: Build Release APK (absesni_digital)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
      KS_ALIAS: ${{ secrets.KS_ALIAS }}
      KS_KEY_PASSWORD: ${{ secrets.KS_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: absesni_digital

      - name: Decode release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ env.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/mmu-release.jks
          cat > android/app/key.properties <<EOF
          storeFile=mmu-release.jks
          storePassword=${{ env.KS_PASSWORD }}
          keyAlias=${{ env.KS_ALIAS }}
          keyPassword=${{ env.KS_KEY_PASSWORD }}
          EOF
        working-directory: absesni_digital

      - name: Build release APK
        run: |
          DART_DEFINES_DEFAULT="--dart-define=GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}"
          if [ -n "${{ env.API_URL }}" ]; then
            DART_DEFINES_DEFAULT="$DART_DEFINES_DEFAULT --dart-define=API_URL=${{ env.API_URL }}"
          fi
          flutter build apk --release $DART_DEFINES_DEFAULT
        working-directory: absesni_digital

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: absesni-release-apk
          path: absesni_digital/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error