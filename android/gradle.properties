# RAM mesin dev hanya 6 GB — heap 8G/4G membuat VM crash (paging file too small).
# Nilai konservatif agar build debug di device stabil.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
# Mencegah korupsi cache incremental Kotlin di Windows saat source plugin (C:) dan
# project (D:) berada di drive berbeda ("this and base files have different roots").
kotlin.incremental=false
